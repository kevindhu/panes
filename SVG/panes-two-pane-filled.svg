  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#tile)"/>
  <rect x="33" y="33" width="446" height="446" rx="99" stroke="url(#edge)" stroke-width="2"/>
  <path d="M160 192H128V352L160 384H320V352" stroke="url(#rear)" stroke-width="20"/>
  <path d="M192 288V128H352L384 160V320H224L192 288Z" fill="url(#green)" stroke="url(#green)" stroke-width="20"/>
