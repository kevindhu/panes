<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Panes</title>
  <desc>A solid electric-green front pane and an outlined rear pane with precision-cut corners on graphite.</desc>
  <defs>
    <linearGradient id="tile" x1="96" y1="32" x2="416" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161B18"/>
      <stop offset="1" stop-color="#070A08"/>
    </linearGradient>
    <linearGradient id="edge" x1="96" y1="32" x2="384" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39443B"/>
      <stop offset="1" stop-color="#161D18"/>
    </linearGradient>
    <linearGradient id="green" x1="192" y1="128" x2="384" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7CFF5B"/>
      <stop offset="1" stop-color="#39FF14"/>
    </linearGradient>
    <linearGradient id="rear" x1="128" y1="192" x2="320" y2="384" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BDD0BF"/>
      <stop offset="1" stop-color="#6D8973"/>
    </linearGradient>
